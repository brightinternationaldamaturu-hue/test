<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Login - BIVA</title>

<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/loader.css">
<link rel="stylesheet" href="../css/auth.css">





<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#00d492">
<meta name="viewport" content="width=device-width, initial-scale=1.0">





</head>

<body class="auth-body">

  <div class="auth-card">

    <div class="auth-logo">
      🔐
    </div>

    <h1>Welcome Back</h1>

    <p class="auth-subtitle">
      Login to continue using BIVA
    </p>

    <!-- EMAIL -->
    <div class="input-group">

      <input
        type="email"
        id="email"
        placeholder="Email address">

      <span class="input-icon">
        📧
      </span>

    </div>

    <!-- PASSWORD -->
    <div class="input-group">

      <input
        type="password"
        id="password"
        placeholder="Password">

      <span
        class="input-icon"
        id="togglePassword">

        👁️

      </span>

    </div>

    <!-- FORGOT -->
    <div class="forgot-link">

      <a href="forgot-password.html">

        Forgot Password?

      </a>

    </div>

    <!-- BUTTON -->
    <button
      id="loginBtn"
      class="auth-btn">

      Login

    </button>

    <!-- LINKS -->
    <div class="auth-links">

      Don't have account?

      <a href="signup.html">

        Create Account

      </a>

    </div>

  </div>



  <script type="module"
          src="../js/pages/login.js"></script>


</body>
</html>
