<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>
    Electricity
  </title>

<link rel="stylesheet" href="../css/profile.css">
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/loader.css">
<link rel="stylesheet" href="../css/bottomnav.css">
<link rel="stylesheet" href="../css/modal.css">
<link rel="stylesheet" href="../css/pinmodal.css">


<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#00d492">
<meta name="viewport" content="width=device-width, initial-scale=1.0">




  <style>

    body{

      background:#0F172A;

      color:white;

      margin:0;

      font-family:Arial,sans-serif;

    }


    .electricity-page{

      padding:20px;

      padding-bottom:120px;

    }


    .electricity-card{

      background:#1E293B;

      border-radius:24px;

      padding:20px;

    }


    .title{

      text-align:center;

      margin-bottom:20px;

    }


    .input{

      width:100%;

      height:55px;

      border:none;

      outline:none;

      border-radius:16px;

      background:#111827;

      color:white;

      padding:0 16px;

      margin-bottom:15px;

      box-sizing:border-box;

    }


    select.input{

      cursor:pointer;

    }


    .verify-box{

      background:#111827;

      border-radius:16px;

      padding:15px;

      margin-bottom:15px;

      display:none;

    }


    .verify-box h3{

      margin:0;

      margin-bottom:5px;

      color:#00D492;

    }


    .btn{

      width:100%;

      height:52px;

      border:none;

      border-radius:16px;

      background:#00A884;

      color:white;

      font-size:16px;

      font-weight:bold;

      cursor:pointer;

    }

  </style>

</head>

<body>

  <div class="electricity-page">

    <div class="electricity-card">

      <h1 class="title">
        Electricity Payment
      </h1>


 

<!-- DISCO -->
<select
  id="disco"
  class="input">

  <option value="">
    Select Disco
  </option>

  <option value="ikeja-electric">
    Ikeja Electric
  </option>

  <option value="eko-electric">
    Eko Electric
  </option>

  <option value="abuja-electric">
    Abuja Electric
  </option>

  <option value="kano-electric">
    Kano Electric
  </option>

  <option value="portharcourt-electric">
    Port Harcourt Electric
  </option>

  <option value="ibadan-electric">
    Ibadan Electric
  </option>

  <option value="kaduna-electric">
    Kaduna Electric
  </option>

  <option value="jos-electric">
    Jos Electric
  </option>

  <option value="enugu-electric">
    Enugu Electric
  </option>

  <option value="benin-electric">
    Benin Electric
  </option>

  <option value="aba-electric">
    Aba Electric
  </option>

  <option value="yola-electric">
    Yola Electric
  </option>

</select>

      <!-- METER -->
      <input
        type="text"
        id="meterNumber"
        class="input"
        placeholder="Enter meter number">


      <!-- TYPE -->
      <select
        id="meterType"
        class="input">

        <option value="prepaid">
          Prepaid
        </option>

        <option value="postpaid">
          Postpaid
        </option>

      </select>


      <!-- VERIFY RESULT -->
      <div
        id="verifyBox"
        class="verify-box">

        <h3 id="meterName">
          JOHN DOE
        </h3>

        <p id="meterAddress">
          Lagos Nigeria
        </p>

      </div>


      <!-- AMOUNT -->
      <input
        type="number"
        id="amount"
        class="input"
        placeholder="Enter amount">


      <!-- BUTTON -->
      <button
        id="buyElectricityBtn"
        class="btn">

        Buy Electricity

      </button>

    </div>

  </div>


  <!-- NAV -->
  <div id="bottomNav"></div>


  <!-- SCRIPT -->
  <script
    type="module"
    src="../js/pages/electricity.js">

  </script>

</body>

</html>
