<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cashback - BIVA</title>

<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/loader.css">
<link rel="stylesheet" href="../css/bottomnav.css">
<link rel="stylesheet" href="../css/modal.css">
<link rel="stylesheet" href="../css/pinmodal.css">
<link rel="stylesheet" href="../css/cashback.css">







<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#00d492">
<meta name="viewport" content="width=device-width, initial-scale=1.0">



</head>

<body class="cashback-page">

  <div class="cashback-container">

    <!-- HEADER -->
    <div class="cashback-header">
      <h1>Cashback Wallet</h1>
      <p>Track your earnings in real time</p>
    </div>

    <!-- SUMMARY CARDS -->
    <div class="cashback-grid">

      <!-- TOTAL EARNED -->
      <div class="cashback-card earned">
        <h3>Total Earned</h3>
        <h2 id="totalEarned">₦0</h2>
      </div>

      <!-- TOTAL WITHDRAWN -->
      <div class="cashback-card withdrawn">
        <h3>Total Withdrawn</h3>
        <h2 id="totalWithdrawn">₦0</h2>
      </div>

      <!-- AVAILABLE -->
      <div class="cashback-card available">
        <h3>Available Cashback</h3>
        <h2 id="availableCashback">₦0</h2>
      </div>

    </div>

    <!-- WITHDRAW BUTTON -->
<button class="withdraw-btn" id="withdrawBtn">
  Withdraw Cashback
</button>

    <!-- TRANSACTION HISTORY -->
    <div class="history-box">

      <h3>Recent Cashback Activity</h3>

      <div id="cashbackHistory">
        <!-- dynamic transactions here -->
      </div>

    </div>

  </div>

<!-- NAV -->
<div id="bottomNav"></div>

  <script type="module" src="../js/pages/cashback.js"></script>

</body>
</html>
