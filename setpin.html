<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Set PIN</title>

  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/setpin.css">




<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#00d492">
<meta name="viewport" content="width=device-width, initial-scale=1.0">






</head>

<body>

  <div class="pin-page">

    <div class="pin-card">

      <h1>
        Transaction PIN
      </h1>

      <p>
        Secure your BIVA transactions
      </p>

      <!-- PIN -->
      <input
        type="password"
        maxlength="4"
        id="pin"
        placeholder="Enter 4 Digit PIN"
      >

      <!-- CONFIRM -->
      <input
        type="password"
        maxlength="4"
        id="confirmPin"
        placeholder="Confirm PIN"
      >

      <!-- BUTTON -->
      <button id="savePinBtn">

        Save PIN

      </button>

    </div>

  </div>

  <script
    type="module"
    src="../js/pages/setpin.js"
  ></script>

</body>
</html>
